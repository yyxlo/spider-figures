{% extends "base.html" %}
{% block title %}登入 · 蜘蛛文獻圖片資料庫{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>登入</h1>
  {% if form.errors %}<p class="error">帳號或密碼錯誤。</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>帳號<input type="text" name="username" autofocus required></label>
    <label>密碼<input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">登入</button>
  </form>
  <p class="muted small">帳號由管理者在後台建立。</p>
</div>
{% endblock %}
