<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜘蛛文獻圖片庫</title>
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">蜘蛛文獻圖片庫</a>
  <form class="topsearch" data-search-form role="search">
    <input type="search" name="q" placeholder="科、屬、種學名或中文名" autocomplete="off" data-search-box aria-label="搜尋">
    <div class="ac-list" hidden></div>
  </form>
  <nav class="mainnav">
    <a href="#/taxa">分類瀏覽</a>
    <a href="#/references">文獻</a>
    <a href="#/compare" data-compare-link>並排比較 <span class="badge" data-compare-count hidden></span></a>
    <a href="#/add" class="btn-small">新增圖片</a>
    <a href="#/settings">設定</a>
  </nav>
</header>
<div class="modebar" data-modebar></div>
<main class="page" id="app"><p class="muted">載入中…</p></main>
<div class="lightbox" hidden>
  <div class="lb-stage"><img alt=""></div>
  <div class="lb-caption"></div>
  <button class="lb-btn lb-close" aria-label="關閉">×</button>
  <button class="lb-btn lb-prev" aria-label="上一張">‹</button>
  <button class="lb-btn lb-next" aria-label="下一張">›</button>
  <div class="lb-hint">滾輪縮放 · 拖曳移動 · 雙擊放大或還原 · Esc 關閉</div>
</div>
<div class="toast" hidden></div>
<!-- Data files are loaded with <script> because browsers block fetch() on pages opened from disk. -->
<script src="data/taxa.js"></script>
<script src="data/index.js"></script>
<script src="app/app.js"></script>
</body>
</html>
