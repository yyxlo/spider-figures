<form class="filters" method="get">
  {% if keep_species %}<input type="hidden" name="species" value="{{ keep_species }}">{% endif %}
  {% if keep_empty %}<input type="hidden" name="empty" value="1">{% endif %}
  <label>構造
    <select name="structure" onchange="this.form.submit()">
      <option value="">全部</option>
      {% for s in structures %}<option value="{{ s.pk }}" {% if selected.structure == s.pk|stringformat:'s' %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
    </select>
  </label>
  <label>性別
    <select name="sex" onchange="this.form.submit()">
      <option value="">全部</option>
      {% for v, l in sex_choices %}<option value="{{ v }}" {% if selected.sex == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </label>
  <noscript><button class="btn-small">套用</button></noscript>
</form>
